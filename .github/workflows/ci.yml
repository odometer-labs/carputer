name: CI

on:
  push:
    branches:
      - main
      - development
      - "dev/**"
  pull_request:
    branches:
      - main
      - development

jobs:
  frontend-checks:
    name: Frontend Lint Typecheck Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/carputer-web-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/carputer-web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --run