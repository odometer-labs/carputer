version: "3"

services:
  map:
    image: overv/openstreetmap-tile-server
    volumes:
      - osm-data:/data/database/
    ports:
      - "8070:80"
    command: "run"
    restart: always
    networks:
      - carputer
    environment:
      - ALLOW_CORS=enabled

volumes:
  osm-data:
    external: true
