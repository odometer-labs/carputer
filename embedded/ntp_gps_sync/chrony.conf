# =============================================================================
# Chrony Configuration — GPSD Time Discipline
# =============================================================================
# Odometer Labs — Carputer Project
#
# This chrony configuration syncs the system clock from GPSD via shared memory
# (SHM) refclocks. GPSD reads time from the u-blox ZED-F9P GPS receiver and
# writes it to SHM segments that chrony polls.
#
# SHM 0 — NMEA time (coarse, ~100ms accuracy)
# SHM 1 — PPS time  (precise, ~1µs accuracy, if wired)
#
# Deploy to: /etc/chrony/chrony.conf
# =============================================================================

# ---------------------------------------------------------------------------
# GPS refclocks via GPSD shared memory
# ---------------------------------------------------------------------------

# SHM 0: NMEA sentence time from GPSD (coarse, ~100ms accuracy)
# - offset 0.0: no fixed offset correction (tune on-device if needed)
# - delay 0.2: maximum expected jitter ~200ms for serial NMEA
# - refid NMEA: label in chronyc sources output
# NOTE: Not marked noselect — the u-blox is USB-only so PPS (SHM 1) may
# not be available. NMEA is the only GPS time source without PPS wiring,
# and is critical for offline operation (no internet → no NTP fallback).
refclock SHM 0 refid NMEA offset 0.0 delay 0.2

# SHM 1: PPS from GPSD (precise, if TIME_PULSE pin is wired)
# - precision 1e-7: expected accuracy ~100ns
# - prefer: prefer this source when available
# - refid PPS: label in chronyc sources output
# - lock NMEA: pair with NMEA for absolute time (PPS is edge-only)
refclock SHM 1 refid PPS precision 1e-7 prefer lock NMEA

# ---------------------------------------------------------------------------
# Fallback NTP servers (when internet is available)
# ---------------------------------------------------------------------------
pool 0.debian.pool.ntp.org iburst maxsources 4
pool 1.debian.pool.ntp.org iburst maxsources 2

# ---------------------------------------------------------------------------
# Time step policy
# ---------------------------------------------------------------------------
# Allow stepping the clock up to 1 second in the first 3 updates after boot.
# After that, only slew (gradual adjustment). This handles cold-boot drift
# without disrupting running applications later.
makestep 1.0 3

# ---------------------------------------------------------------------------
# Drift and RTC
# ---------------------------------------------------------------------------
driftfile /var/lib/chrony/chrony.drift

# Sync the hardware RTC every 11 minutes (standard Linux RTC update interval)
rtcsync

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logdir /var/log/chrony
log tracking measurements statistics refclocks

# ---------------------------------------------------------------------------
# Access control
# ---------------------------------------------------------------------------
# Allow chronyc from localhost only
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
