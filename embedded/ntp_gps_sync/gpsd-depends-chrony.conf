# =============================================================================
# systemd drop-in: gpsd.service depends on chrony
# =============================================================================
# Ensures chronyd is started before gpsd so the time discipline pipeline
# is ready when GPS data begins flowing.
#
# Deploy to: /etc/systemd/system/gpsd.service.d/depends-chrony.conf
# Then run:  sudo systemctl daemon-reload
# =============================================================================

[Unit]
After=chrony.service
Requires=chrony.service
