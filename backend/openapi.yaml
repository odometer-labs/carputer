openapi: 3.0.0
info:
  title: A title
  description: Project description
  version: 0.1.0
servers:
  - url: https://localhost/api/v1
    description: Main server
paths:
  /users:
    get:
      summary: Get a list of users
      operationId: listUsers
      responses:
        '200':
          description: An array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid input

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 101
        name:
          type: string
          example: Foobar
        email:
          type: string
          format: email
          example: foobar@example.com
