#For database, look for README in the backend directory for instructions on how to setup a database and configure
#the env.
services:
  db:
    image: postgres:16
    container_name: carputer_db
    restart: always
    # Docker will look for a .env file in the same directory by default
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driver_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kevin_project_2026}
      POSTGRES_DB: ${POSTGRES_DB:-carputer}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-driver_admin} -d ${POSTGRES_DB:-carputer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
          - ./backend/geotracker/migrations/gps_functions.sql:/docker-entrypoint-initdb.d/init.sql
          - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: