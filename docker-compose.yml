#For database, look for README in the backend directory for instructions on how to setup a database and configure
#the env.
services:
  db:
    image: postgis/postgis:16-3.4 
    container_name: carputer_db
    restart: always
    # Docker will look for a .env file in the same directory by default
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
          - ./backend/geotracker/migrations/gps_functions.sql:/docker-entrypoint-initdb.d/init.sql
          - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: