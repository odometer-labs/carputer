#############################################################
# Direwolf Configuration for APRS Reception
# Raspberry Pi Carputer Project
#############################################################

# Audio input from rtl_fm pipe
ADEVICE stdin null

# Channel configuration
CHANNEL 0
MYCALL N0CALL-10
MODEM 1200

# KISS interface for APRS bridge (port 8003 to avoid conflicts)
KISSPORT 8003

# AGW interface (port 8002 to avoid backend conflict)
AGWPORT 8002

# Log directory (Direwolf will create dated log files)
LOGDIR /var/log/carputer/aprs

# Receive-only configuration (no transmit, no license needed)
# No DIGIPEAT, no IGSERVER, no PBEACON
