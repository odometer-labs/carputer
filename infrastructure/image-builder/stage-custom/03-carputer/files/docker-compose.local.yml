# =============================================================================
# Carputer Docker Compose - Local Build (No GitHub/Registry)
# =============================================================================
# Builds all images locally on the Pi from source code copied during image
# creation. Use this for fully offline/local deployments.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Core API Service (Go + Huma)
  # ---------------------------------------------------------------------------
  core-api:
    build:
      context: ./core-api
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8888:8888"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/v2/root"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - carputer
    depends_on:
      db:
        condition: service_healthy
        restart: true

  # ---------------------------------------------------------------------------
  # API Service (FastAPI)
  # ---------------------------------------------------------------------------
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
    restart: always
    healthcheck:
      test: curl --fail http://localhost:8000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carputer
    depends_on:
      db:
        condition: service_healthy
        restart: true

  # ---------------------------------------------------------------------------
  # GPSD Service (GPSD Python Microservice)
  # ---------------------------------------------------------------------------
  gpsd-service:
    build: ./gpsd
    restart: always
    networks:
      - carputer
    depends_on:
      api:
        condition: service_healthy
        restart: true

  # ---------------------------------------------------------------------------
  # Frontend (Svelte + nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend/carputer-web-app
    ports:
      - "3000:80"
    restart: always
    networks:
      - carputer
    depends_on:
      - api
      - wifi-manager
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # Wifi Management Service
  # ---------------------------------------------------------------------------
  wifi-manager:
    build: ./infrastructure/wifi-manager/
    restart: always
    ports:
      - "9001:9001"
    volumes:
      - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
    networks:
      - carputer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/wifi/version"]
      interval: 360s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS Database
  # ---------------------------------------------------------------------------
  db:
    image: imresamu/postgis:17-3.5-bookworm
    container_name: carputer_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carputer

networks:
  carputer:
    driver: bridge

volumes:
  postgres_data:
